<!DOCTYPE html>
<html>
<head>
<style type="text/css">
.confetti{
	width: 10px;
	height: 60px;
	background-color: lightpink;
	display:inline-block;
	border: 5px solid hotpink;
	position: absolute;
		animation-name:swing3d;

	animation-duration: .5s;
	animation-iteration-count: infinite;
	animation-direction: alternate;
	/*transition:.1s;*/


}

@keyframes swing{

	from{transform:rotate(var(--startRot));}

	to{transform:rotate(var(--endRot))}
}
@keyframes swing3d {
	from {
		transform: RotateZ(-65deg) RotateY(-180deg);
	}
	to { 
		transform: RotateZ(65deg) rotateY(180deg);
	 }
	}
}

</style>


</head>
<body>
	<button id= "btn"> drop confetti </button>
	<input type="color" value="#ff0000" id="colorPicker">
	<input type="range" min="1" max="100" step="1" value="10" id="slider">

	<script type="text/javascript">
		let mycolors = ["pink", "lightpink", "lightblue", "purple", "lightgreen", "lightyellow"]
		console.log(mycolors)
			// colors[0], colors[1], colors[2], colors[3], colors[4], colors[5]


		let dropConfettiBtn = document.getElementById("btn")
		let colorPicker = document.getElementById("colorPicker")
		console.log(colorPicker.value)
		let slider = document.getElementById("slider")
		console.log(slider.value)



function makeConfetti (){
	let square = document.createElement("div") 
	square.classList.add("confetti")
	document.body.appendChild(square)

	let r= Math.round(Math.random()*255)
	 let g= Math.round(Math.random()*255)
	let b= Math.round(Math.random()*255)

	let randomColorIndex = Math.floor(Math.random() * mycolors.length)
	console.log(randomColorIndex)
	// square.style.backgroundColor = mycolors[randomColorIndex]
	square.style.backgroundColor = colorPicker.value
	//square.style.backgroundColor="rgb("+r+","+g+","+b+")"
	square.style.left = Math.round(Math.random()*1500)+"px"
	square.style.top = Math.round(Math.random()*1500)+"px"

	function fall(){
		square.style.top = parseInt(square.style.top)+10+"px"
		// if top is larger than 1000px, we set top to 0px
		if (parseInt(square.style.top) > 1000) {
			square.style.top = '10px'
		}
	}

	setInterval(fall, 70)

	let startRot = Math.random()*-60+"deg"
		let endRot = Math.random()*60+"deg"


	square.style.setProperty("--startRot", startRot)
		square.style.setProperty("--endRot", endRot)


} //end of makeConfetti function

//setInterval(makeConfetti, 200)



dropConfettiBtn.addEventListener("click", function(){
	console.log("i click it")
	for(let i = 1; i <= 100; i++) {
		makeConfetti()

	}
})

</script>

</body>
</html>
