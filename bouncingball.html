<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js">
		</script>
</head>
<body>
	<script>
		let xpos
		let ypos
		let xspeed
		let yspeed
		let d = 50
		let fillColor = "pink"
	function setup(){
		createCanvas(800,800)
		xpos = width/2
		ypos = height/2
		xspeed = 5
		yspeed = 8

	}

	function draw(){
		background(200)
		// if xpos is larger than width (800) OR xpos is less than 0, ball bounces
		if (xpos + d/2 > width || xpos - d/2 < 0){
			xspeed *= -1
		}

		if (ypos + d/2 > height || ypos - d/2 < 0){
			yspeed *= -1
		}

		if (xpos > width/2 && ypos < height/2) {
			fillColor = "white"
		} else {
			fillColor = "pink"
		}
		
		ypos+= yspeed
		xpos += xspeed
		//ypos += 8
		fill(fillColor)
		circle(xpos, ypos, d)

	}


</script>
