<!DOCTYPE html>
<html>
<head>
	<style>
		#badbutton {
			position: absolute;
		}
	</style>

</head>
<body>

	<button id="badbutton">You can't catch me!</button>
<script>
	let badbutton = document.getElementById("badbutton")

	badbutton.addEventListener("click", function(){
console.log("click")
	})
	
	badbutton.addEventListener("mouseover", function() {
		console.log("mouse is hover on button")
		badbutton.style.top = Math.random() * 1000 + window.innerWidth + "px"
		badbutton.style.left = Math.random() * 1000 + window.innerHeight + "px"
	})

	badbutton.addEventListener("mouseout", function(){
		console.log("button out")
	})


</script>








</body>
</html>
