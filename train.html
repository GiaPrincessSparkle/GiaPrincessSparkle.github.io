<!DOCTYPE html>
<html>
<head>
	<style>
		#train{
			display: flex;
			gap: 12px;

		}
		.cart{
			border:1px solid black;
			min-width: 100px;
			height: 80px;
			text-align:center;
			position: relative;


		}
		.cart:before {
			content: "";
			width:30px;
			height: 30px;
			border:1px solid black;
			display: block;
			border-radius:50%;
			position: absolute;
			bottom: -15px;
			left: 10px;
			background-color: white;

		}
		.cart:after{
			content:"" ;
			width:30px;
			height: 30px;
			border:1px solid black;
			display: block;
			border-radius: 50%;
			position: absolute;
			bottom: -15px;
			right: 10px;
			background-color: white;
		}






		}

	</style>


	
</head>
<body>

	<div id ="train">
		
	</div>





	<input type="text" id="person">
	<input type ="color" value="#ff0000" id="colorPicker">
	<button id="add-person">add person</button>

	<button id ="remove-person">remove person</button>


	<script>

		
		//let people = ["alex", "gia", "theo", "lexi"]
		
		let train = document.getElementById("train")
		
		let gia = {
			name:"gia",
			studentID:"c28gs",
			fav_color:"lightpink"
}
		let alex = {
			name:"alex",
			studentId:"c29at",
			fav_color:"lightblue"
		}
		let timmy = {
			name:"timmy",
			studentId:"c29tc",
			fav_color:"lightgreen"
		}
	
		
		let people = [
			gia,
			alex,
			timmy,
			{name: "kevin", studentId: "c29ks", fav_color:"green"}
		]

		people.push({
			name:"lexi",
			fav_color:"pink"

		})

		console.log(people)

		function makeTrain(){
			train.innerHTML=""
		for(let i = 0; i < people.length; i++) {
			console.log(people[i])
			let cart = document.createElement("div")
			cart.textContent = people[i].name
			cart.style.backgroundColor = people[i].fav_color
			cart.classList.add("cart")
			train.appendChild(cart)

		}
	}

	makeTrain()
	

		let addPersonBtn = document.getElementById("add-person")
		addPersonBtn.addEventListener("click", function(){
			let personInput = document.getElementById("person")
			//let colorPicker = document.getElementById("colorPicker")
			people.push({
				name: personInput.value,
				fav_color: colorPicker.value
			})
			console.log(personInput.value)
		
			makeTrain()
			console.log(people)
		})


		let removePersonBtn = document.getElementById("remove-person")
		removePersonBtn.addEventListener("click", function(){
		let removepersonInput = document.getElementById("person")
		console.log(removepersonInput.value)
		people.pop()
		makeTrain()
		console.log(people)
		})


	</script>

</body>
</html>
